name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mobile:
    name: Mobile · types, lint, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck -w mobile
      - name: Lint
        run: npm run lint -w mobile
      - name: Unit tests
        run: npm run test:unit -w mobile -- --ci --coverage
      - name: Component tests
        run: npm run test:components -w mobile -- --ci --coverage

  api:
    name: API · types, lint, tests, build
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_ci_password
          MYSQL_DATABASE: cocina_test
          MYSQL_USER: cocina
          MYSQL_PASSWORD: cocina_ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_ci_password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      # Throwaway credentials for the job-scoped service container above.
      DATABASE_URL: mysql://cocina:cocina_ci_password@127.0.0.1:3306/cocina_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate Prisma schema
        run: npm run prisma:validate -w api
      - name: Generate Prisma client
        run: npm run prisma:generate -w api
      - name: Apply migrations
        if: hashFiles('services/api/prisma/migrations/**') != ''
        run: npx prisma migrate deploy
        working-directory: services/api
      - name: TypeScript
        run: npm run typecheck -w api
      - name: Lint
        run: npm run lint -w api
      - name: Unit tests
        run: npm run test -w api
      - name: Integration tests
        run: npm run test:e2e -w api
      - name: Build
        run: npm run build -w api

  dependencies:
    name: Dependency validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Fails when package.json and package-lock.json are out of sync.
      - run: npm ci
      - name: Expo Doctor
        run: npx expo-doctor@latest
        working-directory: apps/mobile
      - name: Expo SDK version alignment
        run: npx expo install --check
        working-directory: apps/mobile

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: API production dependencies (high and above)
        run: npm audit -w api --omit=dev --audit-level=high
      # The Expo/Metro build toolchain ships unfixed high advisories upstream
      # (not bundled into the app), so the whole tree only blocks on critical.
      - name: All production dependencies (critical)
        run: npm audit --omit=dev --audit-level=critical
      - name: Full audit report
        if: always()
        run: |
          {
            echo '### npm audit (production dependencies)'
            echo '```'
            npm audit --omit=dev || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Needs the dependency graph: public repositories or GitHub Advanced Security.
      - name: Dependency review
        if: github.event_name == 'pull_request' && !github.event.repository.private
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  changes:
    name: Detect mobile changes
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mobile=true
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$BASE_SHA" "$GITHUB_SHA" \
              | grep -qE '^(apps/mobile/|package(-lock)?\.json$|\.github/workflows/ci\.yml$)'; then
              mobile=false
            fi
          fi
          echo "mobile=$mobile" >> "$GITHUB_OUTPUT"

  build-ios:
    name: iOS build (EAS, internal distribution)
    needs: [changes, mobile, api, dependencies, security]
    # Fork pull requests never receive secrets, so they cannot build.
    if: >-
      needs.changes.outputs.mobile == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: write
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Check EAS configuration
        id: eas
        run: |
          ready=true
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::warning::EXPO_TOKEN secret is not set; the iOS build was NOT generated."
            ready=false
          fi
          if [ "$(jq -r '.expo.extra.eas.projectId // empty' apps/mobile/app.json)" = "" ]; then
            echo "::warning::apps/mobile/app.json has no EAS projectId (run 'eas init'); the iOS build was NOT generated."
            ready=false
          fi
          if [ "$ready" = false ]; then
            echo "⚠️ iOS build skipped: EAS is not configured yet. See README → Probar en un iPhone." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        if: steps.eas.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: expo/expo-github-action@v9
        if: steps.eas.outputs.ready == 'true'
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
        if: steps.eas.outputs.ready == 'true'
      - name: Build
        if: steps.eas.outputs.ready == 'true'
        working-directory: apps/mobile
        run: eas build --platform ios --profile preview --non-interactive --wait --json > "$RUNNER_TEMP/build.json"
      - name: Publish install link
        if: steps.eas.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          build="$RUNNER_TEMP/build.json"
          id=$(jq -r '.[0].id' "$build")
          owner=$(jq -r '.[0].project.ownerAccount.name // empty' "$build")
          slug=$(jq -r '.[0].project.slug // empty' "$build")
          if [ -n "$owner" ] && [ -n "$slug" ]; then
            url="https://expo.dev/accounts/$owner/projects/$slug/builds/$id"
          else
            url="https://expo.dev (build id: $id)"
          fi
          {
            echo "### 📱 iOS build ready"
            echo
            echo "Open this link on a registered iPhone to install it: $url"
            echo
            echo "Commit: \`${GITHUB_SHA::7}\` · Profile: \`preview\`"
          } > "$RUNNER_TEMP/comment.md"
          cat "$RUNNER_TEMP/comment.md" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          fi
