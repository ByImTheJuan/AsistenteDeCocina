# MySQL para desarrollo local y pruebas de integración.
# Las credenciales son solo para uso local; no reutilizar en entornos compartidos.
services:
  mysql:
    image: mysql:8.4
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_password
      MYSQL_DATABASE: cocina_dev
      MYSQL_USER: cocina
      MYSQL_PASSWORD: cocina_dev_password
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
